# Push a tag like v1.2 to build the app on GitHub's Apple Silicon runner and
# publish PingInfoView-1.2-arm64.zip as a GitHub Release. Installed copies of
# the app find that release and offer to update themselves.
#
#   git tag v1.2 && git push origin v1.2
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15  # arm64 (Apple Silicon)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i '' "s/^__version__ = .*/__version__ = \"$VERSION\"/" pinginfoview/__init__.py
          grep '^__version__' pinginfoview/__init__.py

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-build.txt pytest

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: .venv/bin/python -m pytest -q

      - name: Build
        run: ./build_app.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/PingInfoView-*.zip \
            --title "PingInfoView ${GITHUB_REF_NAME#v}" --generate-notes
